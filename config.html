<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视觉主题配置生成器</title>
<link rel="icon" type="image/jpeg" href="/logo.jpg?v=brand-icon-20261118">
<link rel="apple-touch-icon" href="/logo.jpg?v=brand-icon-20261118">
<style>
:root{--accent:#00d9ff;--radius:16px;--text:#eaf4ff;--muted:#8fa5bd}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;color:var(--text);background:#080d18;font-family:Arial,"Microsoft YaHei",sans-serif}
header,.layout{max-width:1100px;margin:auto}header{margin-bottom:24px}h1{font-size:25px;margin:0 0 8px}header p,.hint{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:minmax(280px,390px) 1fr;gap:20px}.panel{padding:22px;border:1px solid #24334b;border-radius:18px;background:#101a2b}.section-title{font-size:15px;font-weight:bold;margin-bottom:20px}.field{margin-bottom:23px}.field label.title{display:block;font-size:13px;margin-bottom:10px}
select,input[type=color]{width:100%;height:43px;border:1px solid #34445c;border-radius:9px;background:#0b1423;color:white;padding:0 12px}input[type=color]{padding:5px;cursor:pointer}.switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:17px 0;font-size:13px}.switch{position:relative;width:44px;height:24px;flex-shrink:0}.switch input{display:none}.switch span{position:absolute;inset:0;border-radius:30px;background:#39475c;cursor:pointer;transition:.2s}.switch span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:white;transition:.2s}.switch input:checked+span{background:var(--accent)}.switch input:checked+span:before{transform:translateX(20px)}
.range-line{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:9px}input[type=range]{width:100%;accent-color:var(--accent)}.preview-area{min-height:420px;display:flex;flex-direction:column}.preview-stage{position:relative;flex:1;min-height:330px;overflow:hidden;border-radius:13px;display:grid;place-items:center;isolation:isolate}.preview-stage:before{content:"";position:absolute;inset:0;z-index:-2;background:var(--preview-bg)}.preview-stage:after{content:"";position:absolute;inset:0;z-index:-1;opacity:.4;background-image:var(--pattern);background-size:var(--pattern-size,35px 35px)}
.preview-card{width:min(78%,330px);padding:23px;border:1px solid color-mix(in srgb,var(--accent),transparent 45%);border-radius:var(--radius);background:var(--card-bg);box-shadow:0 0 28px color-mix(in srgb,var(--accent),transparent 82%);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:.2s}.preview-tag{display:inline-block;padding:5px 10px;border-radius:20px;color:var(--accent);background:color-mix(in srgb,var(--accent),transparent 88%);font-size:11px}.preview-card h2{font-size:19px;margin:16px 0 8px}.preview-card p{font-size:12px;line-height:1.7;color:#a8bbd2}.preview-button{margin-top:10px;padding:9px 14px;border:0;border-radius:7px;background:var(--accent);color:#07111d;font-weight:bold}
.generate{width:100%;padding:13px;border:0;border-radius:10px;color:#06111d;background:var(--accent);font-size:14px;font-weight:bold;cursor:pointer}.output{display:none;margin-top:18px}.output textarea{width:100%;min-height:210px;resize:vertical;padding:13px;border:1px solid #34445c;border-radius:9px;background:#080f1c;color:#a8e9ff;font:12px/1.6 Consolas,monospace}.copy{width:100%;margin-top:9px;padding:11px;border:1px solid var(--accent);border-radius:8px;background:transparent;color:var(--accent);cursor:pointer}
@media(max-width:720px){body{padding:18px 13px}.layout{grid-template-columns:1fr}.preview-area{min-height:390px}}
</style></head><body>
<header><h1>✦ 视觉主题配置生成器</h1><p>调整视觉风格，实时预览并生成主网站可读取的 JSON 配置。</p></header>
<main class="layout"><section class="panel"><div class="section-title">⚙️ 视觉参数设置</div>
<div class="field"><label class="title" for="effect">选择背景动态特效</label><select id="effect"><option value="particles">星空粒子</option><option value="cyber-grid">赛博朋克网格</option><option value="solid">纯色视频</option><option value="minimal-dark">极简暗黑</option></select></div>
<div class="field"><label class="title" for="accent">选择主色调 / 发光色</label><input type="color" id="accent" value="#00d9ff"></div>
<div class="switch-row"><span>开启毛玻璃卡片特效</span><label class="switch"><input type="checkbox" id="glass" checked><span></span></label></div>
<div class="field"><div class="range-line"><label for="radius">卡片圆角大小</label><strong><span id="radiusValue">16</span> px</strong></div><input type="range" id="radius" min="0" max="36" value="16"></div>
<button class="generate" id="generate">✦ 生成视觉配置</button>
<div class="output" id="output"><div class="section-title" style="margin-top:20px">theme_config.json</div><textarea id="jsonOutput" readonly></textarea><button class="copy" id="copy">复制 JSON 配置</button><p class="hint">生成的文件放到仓库根目录后，主页面会自动读取。</p><button class="copy" id="download">下载 theme_config.json</button></div>
</section><section class="panel preview-area"><div class="section-title">◈ 实时视觉预览</div><div class="preview-stage" id="preview"><div class="preview-card" id="previewCard"><span class="preview-tag">LIVE PREVIEW</span><h2>科技视觉体验</h2><p>调整左侧参数，观察颜色、背景和卡片样式的实时变化。</p><button class="preview-button">立即探索</button></div></div><div class="hint">预览为 CSS 模拟效果；实际页面将根据配置应用对应主题。</div></section></main>
<script>
const $=id=>document.getElementById(id),effect=$("effect"),accent=$("accent"),glass=$("glass"),radius=$("radius"),radiusValue=$("radiusValue"),preview=$("preview"),previewCard=$("previewCard");
const styles={particles:{background:"radial-gradient(ellipse at 20% 20%,#142e54,#080d18 72%)",pattern:"radial-gradient(circle,#8eeaff 1px,transparent 1.5px)",size:"35px 35px"},"cyber-grid":{background:"linear-gradient(145deg,#190d2b,#071322)",pattern:"linear-gradient(rgba(0,217,255,.32) 1px,transparent 1px),linear-gradient(90deg,rgba(0,217,255,.32) 1px,transparent 1px)",size:"30px 30px"},solid:{background:"linear-gradient(135deg,#17263b,#080d18)",pattern:"none",size:"auto"},"minimal-dark":{background:"#090b10",pattern:"radial-gradient(ellipse at center,#18202c 0%,transparent 70%)",size:"auto"}};
function update(){const c=accent.value,s=styles[effect.value];document.documentElement.style.setProperty("--accent",c);document.documentElement.style.setProperty("--radius",radius.value+"px");preview.style.setProperty("--preview-bg",s.background);preview.style.setProperty("--pattern",s.pattern);preview.style.setProperty("--pattern-size",s.size);previewCard.style.setProperty("--card-bg",glass.checked?"rgba(16,27,45,.58)":"#111c2e");previewCard.style.setProperty("--blur",glass.checked?"blur(14px)":"none");radiusValue.textContent=radius.value}
function config(){return{version:1,theme:{background_effect:effect.value,accent_color:accent.value,glass_card:glass.checked,card_radius:Number(radius.value)}}}
[effect,accent,glass,radius].forEach(el=>{el.addEventListener("input",update);el.addEventListener("change",update)});
$("generate").addEventListener("click",()=>{$("jsonOutput").value=JSON.stringify(config(),null,2);$("output").style.display="block"});
$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText($("jsonOutput").value);$("copy").textContent="✓ 已复制"}catch{$("jsonOutput").select();$("copy").textContent=document.execCommand("copy")?"✓ 已复制":"请手动复制"}});
$("download").addEventListener("click",()=>{const blob=new Blob([JSON.stringify(config(),null,2)+"\n"],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="theme_config.json";a.click();URL.revokeObjectURL(a.href)});update();
</script></body></html>
