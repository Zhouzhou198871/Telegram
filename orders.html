<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f9fc"><title>订单详情｜晴天商城</title>
<link rel="icon" href="./logo.jpg"><link rel="stylesheet" href="./shop.css?v=subpage-header-workbench-20261126-v1">
<style>
body[data-page="orders"]{background:#f7f9fc!important;color:#243247!important;min-height:100vh}
.orders-header{width:min(920px,calc(100% - 32px));height:76px;margin:auto;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5eaf1}
.orders-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#3984d8;font-size:19px;font-weight:800}.orders-brand img{width:42px;height:42px;object-fit:cover;border-radius:12px}
.orders-actions{display:flex;gap:9px}.orders-actions a,.orders-actions button{border:1px solid #dce3ec;border-radius:10px;background:#fff;color:#3b82f6;padding:9px 12px;text-decoration:none;font-size:13px;cursor:pointer}
.orders-main{width:min(820px,calc(100% - 32px));margin:24px auto 60px}
.orders-breadcrumb{font-size:13px;color:#8491a3;margin:0 0 22px}.orders-breadcrumb a{color:#3984d8;text-decoration:none}
.orders-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}.orders-main h1{font-size:27px;margin:0 0 8px;color:#243247}.orders-subtitle{color:#748196;font-size:14px;line-height:1.7;margin:0;max-width:620px}
.orders-count{flex:0 0 auto;padding:7px 11px;border-radius:999px;background:#edf5ff;color:#2868c7;font-size:12px;font-weight:750}
.orders-filters{display:flex;gap:8px;overflow-x:auto;padding:3px 0 14px;margin-bottom:3px}
.orders-filter{border:1px solid #dce4ee;border-radius:999px;background:#fff;color:#64748b;padding:9px 14px;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer}
.orders-filter.active{border-color:#8bb8ef;background:#eef6ff;color:#2868b5}
.orders-list{display:grid;gap:13px}.order-card{padding:17px;border:1px solid #e0e5ec;border-radius:15px;background:#fff;box-shadow:0 8px 24px rgba(15,23,42,.04)}
.order-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.order-heading{min-width:0}.order-kind{display:inline-block;margin-bottom:5px;color:#8290a3;font-size:11px;font-weight:700}.order-name{font-weight:750;font-size:16px;line-height:1.55;overflow-wrap:anywhere;color:#243247}
.order-status{white-space:nowrap;border-radius:20px;padding:5px 9px;font-size:12px;background:#eff6ff;color:#2563eb}.order-status.status-delivered,.order-status.status-fulfilled,.order-status.status-paid,.order-status.status-active{background:#ecfdf3;color:#16834a}.order-status.status-refunded,.order-status.status-failed,.order-status.status-closed{background:#fff1f2;color:#dc2626}.order-status.status-expired{background:#f1f5f9;color:#64748b}
.order-meta{font-size:12px;color:#8390a2;line-height:1.8;margin-top:9px;overflow-wrap:anywhere;white-space:pre-line}
.order-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:13px}.order-price{font-size:19px;font-weight:800;color:#16834a}
.detail-toggle,.detail-action{border:1px solid #d7e4f5;border-radius:9px;background:#f4f8ff;color:#2868c7;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer}.detail-toggle:disabled,.detail-action:disabled{opacity:.55;cursor:wait}
.order-detail-panel{margin-top:15px;padding:15px;border:1px solid #e8edf3;border-radius:12px;background:#fbfcfe}.order-detail-row{display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid #edf1f6;font-size:13px;line-height:1.6}.order-detail-label{color:#8290a3}.order-detail-value{color:#334155;overflow-wrap:anywhere;text-align:right}.order-delivery-section{margin-top:15px}.order-detail-section-title{display:block;font-size:14px;color:#334155;margin-bottom:10px}.order-detail-muted{font-size:13px;color:#8491a3;line-height:1.7;margin:10px 0}.order-delivery-content{display:grid;gap:10px}
.order-copy-row{display:grid;grid-template-columns:112px minmax(0,1fr) auto;align-items:start;gap:9px;padding:10px;border-radius:9px;background:#f1f5f9}.order-copy-row code,.order-delivery-content pre{font-size:12px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;color:#334155}.copy-button{border:1px solid #d8e2ee;border-radius:7px;background:#fff;color:#2868c7;padding:6px 9px;font-size:12px;cursor:pointer}
.orders-state{padding:38px 18px;text-align:center;color:#8491a3;background:#fff;border:1px solid #e0e5ec;border-radius:15px}.orders-notice{padding:11px 13px;border-radius:10px;background:#fff8e8;color:#93651a;font-size:13px;line-height:1.6}
@media(max-width:560px){.orders-main h1{font-size:24px}.orders-brand{font-size:17px}.order-card{padding:14px}.orders-title-row{gap:8px}.orders-count{font-size:11px}.order-detail-row{grid-template-columns:88px minmax(0,1fr)}.order-copy-row{grid-template-columns:1fr auto}.order-copy-row .order-detail-label{grid-column:1/-1}.order-copy-row code{grid-column:1}.order-copy-row .copy-button{grid-column:2;grid-row:2}}
</style>
<script src="./orders.js?v=subpage-header-workbench-20261126-v1" defer></script>
</head>
<body data-page="orders">
<header class="orders-header"><a class="orders-brand" href="./shop.html"><img src="./logo.jpg" alt="晴天商城"><span>晴天商城</span></a><div class="orders-actions"><a href="./shop.html" aria-label="返回首页">返回首页</a></div></header>
<main class="orders-main">
<nav class="orders-breadcrumb" aria-label="当前位置"><a href="./shop.html" data-i18n="home">首页</a>　/　<a href="./shop.html#accountMenu" data-i18n="myAccount">我的账户</a>　/　<span aria-current="page" data-i18n="title">订单详情</span></nav>
<div class="orders-title-row"><div><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h1 id="ordersTitle">订单详情</h1><button id="languageToggle" type="button" class="detail-action">English</button><button id="refreshOrders" type="button" class="detail-action" data-i18n="refresh">刷新订单</button></div><p class="orders-subtitle" id="ordersSubtitle">查看你的商品订单、付款状态、发货进度与已交付卡密。</p></div><span class="orders-count"><span id="ordersCount">0</span> 条</span></div>
<nav class="orders-filters" aria-label="订单类型筛选">
<button class="orders-filter active" type="button" data-filter="all">全部</button>
<button class="orders-filter" type="button" data-filter="goods">商品订单</button>

</nav>
<section id="ordersList" class="orders-list" aria-live="polite"><div class="orders-state">正在读取订单…</div></section>
</main>
</body></html>
