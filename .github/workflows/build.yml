name: Build and deploy static site

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "script.js"
      - "config.html"
      - "theme_config.json"
      - "scripts/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Telegram sync script
        run: python -m py_compile scripts/sync_telegram.py

      - name: Prepare static output
        run: |
          mkdir -p _site
          cp index.html style.css script.js config.html _site/
          if [ -f theme_config.json ]; then cp theme_config.json _site/; fi
          for asset in logo.jpg logo.png bg.webm bg.mp4; do
            if [ -f "$asset" ]; then cp "$asset" _site/; fi
          done

      - name: Export public data from pinned Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          OUTPUT_JSON: _site/data.json
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$CHANNEL_ID" ]; then
            echo "::warning::Telegram Secrets are missing; publishing an empty catalog until configured."
            printf '{"schema_version":1,"products":[],"announcements":[],"updated_at":null}\\n' > "$OUTPUT_JSON"
          else
            python scripts/sync_telegram.py
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
