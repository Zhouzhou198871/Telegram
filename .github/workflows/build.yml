name: Build and deploy Qingtian Shop to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "auth.html"
      - "register.html"
      - "shop.html"
      - "style.css"
      - "script.js"
      - "astronaut-3d.js"
      - "config.html"
      - "terms.html"
      - "privacy.html"
      - "logo.jpg"
      - "logo.png"
      - "bg.mp4"
      - "bg.webm"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate frontend JavaScript
        run: node --check script.js
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html auth.html register.html shop.html style.css script.js astronaut-3d.js config.html terms.html privacy.html _site/
          for asset in logo.jpg logo.png bg.webm bg.mp4; do
            if [ -f "$asset" ]; then cp "$asset" _site/; fi
          done
          test -s _site/index.html
          test -s _site/auth.html
          test -s _site/register.html
          test -s _site/shop.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
