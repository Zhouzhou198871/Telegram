name: Bind Custom Domain

on:
  push:
    branches:
      - main

permissions:
  pages: write

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - name: Bind Domain via GitHub CLI
        run: |
          gh api -X PUT repos/Zhouzhou198871/Telegram/pages -f cname="shop.lynli.me" -F https_enforced=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
