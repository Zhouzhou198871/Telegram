name: Bind Custom Domain

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - name: Bind custom domain
        run: |
          gh api -X PUT repos/Zhouzhou198871/Telegram/pages -f cname="shop.lynli.me"
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_PAT }}

      - name: Wait for GitHub Pages certificate
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            response="$(gh api repos/Zhouzhou198871/Telegram/pages)"
            state="$(printf '%s' "$response" | jq -r '.https_certificate.state // "not-created"')"
            echo "Certificate state: $state (attempt $attempt/30)"
            if [ "$state" = "approved" ] || [ "$state" = "issued" ] || [ "$state" = "uploaded" ]; then
              exit 0
            fi
            sleep 60
          done
          echo "GitHub Pages certificate was not ready within 30 minutes; HTTPS enforcement was not enabled."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_PAT }}

      - name: Enforce HTTPS and verify
        run: |
          gh api -X PUT repos/Zhouzhou198871/Telegram/pages -f cname="shop.lynli.me" -F https_enforced=true
          gh api repos/Zhouzhou198871/Telegram/pages --jq '{cname, https_protocol_domain, https_certificate, https_enforced}'
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_PAT }}
