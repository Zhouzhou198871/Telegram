name: Inspect Pages Certificate

on:
  push:
    branches:
      - main

permissions:
  pages: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read Pages certificate status
        run: |
          gh api repos/Zhouzhou198871/Telegram/pages --jq '{cname, https_protocol_domain, https_certificate, https_enforced}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
