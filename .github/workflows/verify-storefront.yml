name: Validate storefront

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check profile.js
          node --check login.js
          node --check orders.js
          node --check invite.js
          node --check api/index.js
          node --check worker.js
      - name: Verify Vercel configuration
        run: node -e "const c=require('./vercel.json'); if(c.version!==2 || !Array.isArray(c.rewrites)) process.exit(1); console.log('Vercel config OK')"
