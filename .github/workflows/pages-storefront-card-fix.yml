name: Build storefront card update to GitHub Pages

on:
  push:
    branches: [pages-storefront-card-fix]
    paths:
      - "shop.html"
      - "shop.css"
      - "script.js"
      - "profile.html"
      - "profile.js"
      - "invite.html"
      - "invite.js"
      - "orders.html"
      - "orders.js"
      - ".github/workflows/pages-storefront-card-fix.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate frontend JavaScript
        run: |
          node --check script.js
          node --check login.js
          node --check reset-password.js
          node --check profile.js
          node --check invite.js
          node --check orders.js
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html auth.html register.html shop.html style.css shop.css script.js login.js reset-password.html reset-password.js config.html terms.html privacy.html profile.html profile.js invite.html invite.js orders.html orders.js _site/
          for asset in logo.jpg logo.png bg.webm bg.mp4 CNAME; do
            if [ -f "$asset" ]; then cp "$asset" _site/; fi
          done
          test -s _site/index.html
          test -s _site/shop.html
          test -s _site/shop.css
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
