name: Build and deploy storefront preview

on:
  push:
    branches:
      - vercel-migration-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storefront-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel preview environment
        run: vercel pull --yes --environment=preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_DUhm5Zk8noZ3rBL8HkuHQTgq
          VERCEL_PROJECT_ID: prj_xFohRe9ftYCvEAtFr6XXX8LKr6k9

      - name: Build with Vercel
        run: vercel build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_DUhm5Zk8noZ3rBL8HkuHQTgq
          VERCEL_PROJECT_ID: prj_xFohRe9ftYCvEAtFr6XXX8LKr6k9

      - name: Deploy preview
        run: vercel deploy --prebuilt --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_DUhm5Zk8noZ3rBL8HkuHQTgq
          VERCEL_PROJECT_ID: prj_xFohRe9ftYCvEAtFr6XXX8LKr6k9
