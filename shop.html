<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <meta name="description" content="晴天号铺商品商城">
  <link rel="icon" type="image/jpeg" href="/logo.jpg?v=brand-icon-20261118">
  <link rel="apple-touch-icon" href="/logo.jpg?v=brand-icon-20261118">
  <title>晴天号铺 · 商品商城</title>
  <link rel="stylesheet" href="./shop.css?v=market-layout-cn-20261118">
</head>
<body data-page="shop">
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <header class="topbar">
    <a class="brand" href="./shop.html" aria-label="晴天号铺首页">
      <img class="brand-logo" src="./logo.jpg" alt="晴天号铺">
      <span class="brand-title">晴天号铺</span>
    </a>
    <div class="top-actions">
      <div class="account-menu-wrap">
        <button class="avatar-button" id="accountMenuToggle" type="button" aria-label="打开账户菜单" aria-expanded="false" aria-controls="accountMenu">
          <span class="avatar-initial" id="avatarInitial">晴</span>
          <span class="login-state">已登录</span>
          <span class="menu-chevron" aria-hidden="true">⌄</span>
        </button>
        <section class="account-menu-card" id="accountMenu" hidden aria-label="账户菜单">
          <div class="account-card-head">
            <span class="avatar-large" id="avatarInitialLarge">晴</span>
            <div class="account-card-identity">
              <strong>我的账户</strong>
              <span id="accountEmail">正在验证…</span>
            </div>
          </div>
          <div class="account-balance-row"><span>账户余额</span><strong><b id="balance">—</b> USDT</strong></div>
          <a class="account-card-link" href="#accountInfo">账户信息 <span>›</span></a>
          <a class="account-card-link" href="https://t.me/qingtian_Boss" target="_blank" rel="noopener noreferrer">联系客服 <span>↗</span></a>
          <button class="account-logout" id="logout" type="button">退出登录</button>
        </section>
      </div>
    </div>
  </header>
  <main class="shop-main">
    <nav class="breadcrumb" aria-label="当前位置"><a href="./shop.html">首页</a><span>/</span><span>商品购买</span><span>/</span><strong>全部商品</strong></nav>
    <section class="shop-hero">
      <div class="hero-copy-card">
        <div class="eyebrow"><span class="pulse"></span> 晴天号铺 · 商品商城</div>
        <h1>精选账号与数字商品<br><span>安全选购 · 即时交付</span></h1>
        <p class="hero-copy">商品库存与售价实时读取，支持在线下单。下单前请核对商品信息。</p>
        <div class="hero-tags">
          <span>实时库存</span><span>明码标价</span><span>在线交付</span>
        </div>
      </div>
    </section>
    <section class="catalog-section" id="accountInfo">
      <div class="section-heading">
        <div><div class="section-kicker">商品选购</div><h2>全部商品</h2></div>
        <button class="secondary-button" id="refreshProducts" type="button">刷新商品 ↻</button>
      </div>
      <p class="form-message" id="shopMessage" role="status" aria-live="polite"></p>
      <div class="catalog-tools">
        <label class="search-box"><span aria-hidden="true">⌕</span><input id="productSearch" type="search" placeholder="搜索商品名称…" autocomplete="off"></label>
        <div class="catalog-selects">
          <label><span class="sr-only">商品分类</span><select id="categoryFilter"><option value="">全部分类</option></select></label>
          <label><span class="sr-only">商品排序</span><select id="sortProducts"><option value="default">默认排序</option><option value="price-asc">价格从低到高</option><option value="price-desc">价格从高到低</option><option value="stock-desc">库存从高到低</option></select></label>
        </div>
      </div>
      <div class="product-grid" id="productGrid" aria-live="polite">
        <div class="loading-card">正在连接商品目录…</div>
      </div>
    </section>
  </main>
  <div class="modal-backdrop" id="deliveryModal" hidden>
    <section class="delivery-modal" role="dialog" aria-modal="true" aria-labelledby="deliveryTitle">
      <button class="modal-close" id="closeModal" type="button" aria-label="关闭">×</button>
      <div class="eyebrow">订单交付</div>
      <h2 id="deliveryTitle">购买成功</h2>
      <p class="modal-copy">请及时保存以下交付内容。</p>
      <pre class="delivery-content" id="deliveryContent"></pre>
      <button class="primary-button full-button" id="copyDelivery" type="button">复制卡密</button>
    </section>
  </div>
  <footer class="footer-note" style="width:100%;margin:20px auto 0;text-align:center;color:#a1aab8;font-size:10px;line-height:1.6">2026 晴天号铺 版权所有<br>所有账号仅供合法合规用途，严禁用于任何违法行为。</footer>
  <script>
  (() => {
    const toggle = document.getElementById("accountMenuToggle");
    const menu = document.getElementById("accountMenu");
    const wrap = toggle && toggle.closest(".account-menu-wrap");
    if (!toggle || !menu || !wrap || toggle.dataset.menuBound === "true") return;
    toggle.dataset.menuBound = "true";
    const close = () => {
      menu.hidden = true;
      toggle.setAttribute("aria-expanded", "false");
    };
    toggle.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();
      const open = toggle.getAttribute("aria-expanded") !== "true";
      menu.hidden = !open;
      toggle.setAttribute("aria-expanded", String(open));
    });
    menu.addEventListener("click", event => event.stopPropagation());
    document.addEventListener("click", event => {
      if (!wrap.contains(event.target)) close();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") close();
    });
  })();
  </script>
  <script src="./script.js?v=account-menu-fix-20261118" defer></script>
</body>
</html>
