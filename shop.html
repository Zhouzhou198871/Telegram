<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <meta name="description" content="晴天号铺商品商城">
  <link rel="icon" type="image/jpeg" href="/logo.jpg?v=brand-icon-20261118-v2">
  <link rel="apple-touch-icon" href="/logo.jpg?v=brand-icon-20261118-v2">
  <title>晴天号铺 · 商品商城</title>
  <link rel="stylesheet" href="./shop.css?v=storefront-home-nav-20261118-v1">
</head>
<body data-page="shop">
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <header class="topbar">
    <a class="brand" href="./shop.html" aria-label="晴天号铺首页">
      <img class="brand-logo" src="./logo.jpg" alt="晴天号铺">
      <span class="brand-title">晴天号铺</span>
    </a>
    <nav class="shop-primary-nav" aria-label="商城主导航">
      <a class="shop-nav-link is-active" href="#home" data-shop-view="home" aria-current="page">首页</a>
      <a class="shop-nav-link" href="#catalog" data-shop-view="products">商品</a>
    </nav>
    <div class="top-actions">
      <details class="account-menu-wrap" id="accountMenuWrap">
        <summary class="avatar-button" id="accountMenuToggle" aria-label="打开账户菜单" aria-expanded="false" aria-controls="accountMenu">
          <span class="avatar-trigger-photo" aria-hidden="true">
            <svg class="account-user-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="8" r="3.5" fill="currentColor"/>
              <path d="M5.5 20c.35-3.55 3.1-5.75 6.5-5.75s6.15 2.2 6.5 5.75" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="account-status-text">已登录</span>
        </summary>
        <section class="account-menu-card" id="accountMenu" hidden aria-label="账户菜单">
          <div class="account-card-head">
            <span class="avatar-large" id="avatarInitialLarge">晴</span>
            <img class="avatar-large-image" id="avatarImageLarge" alt="账户头像" hidden>
            <div class="account-card-identity">
              <strong id="accountName">我的账户</strong>
              <span id="accountEmail">正在验证…</span>
            </div>
          </div>
          <div class="account-balance-row"><span data-i18n="balanceLabel">账户余额</span><strong><b id="balance">¥0.00</b></strong></div>
          <a class="account-card-link" href="./profile.html" data-i18n="accountInfo">账户信息 <span>›</span></a>
          <a class="account-card-link" href="./invite.html" data-i18n="inviteRewards">邀请奖励 <span>›</span></a>
          <a class="account-card-link" href="./orders.html" data-i18n="orderHistory">历史订单 <span>›</span></a>
          <a class="account-card-link" href="https://t.me/qingtian_Boss" target="_blank" rel="noopener noreferrer" data-i18n="support">联系客服 <span>↗</span></a>
          <button class="account-card-link language-toggle" id="languageToggle" type="button"><span data-i18n="language">语言</span><strong id="languageToggleLabel">English</strong></button>
          <button class="account-logout" id="logout" type="button" data-i18n="logout">退出登录</button>
        </section>
      </details>
    </div>
  </header>
  <main class="shop-main">
    <section class="shop-hero" id="home">
      <div class="hero-copy-card">
        <div class="eyebrow"><span class="pulse"></span> <span data-i18n="heroEyebrow">晴天号铺 · 商品商城</span></div>
        <h1><span data-i18n="heroTitle">精选账号与数字商品</span><br><span data-i18n="heroSubtitle">安全选购 · 即时交付</span></h1>
        <p class="hero-copy" data-i18n="heroCopy">商品库存与售价实时读取，支持在线下单。下单前请核对商品信息。</p>
        <div class="hero-tags">
          <span data-i18n="tagStock">实时库存</span><span data-i18n="tagPrice">明码标价</span><span data-i18n="tagDelivery">在线交付</span>
        </div>
      </div>
    </section>
    <section class="catalog-section" id="accountInfo">
      <div class="section-heading" id="catalog">
        <div><div class="section-kicker" data-i18n="catalogEyebrow">商品选购</div><h2 data-i18n="catalogHeading">上架商品</h2></div>
        <button class="secondary-button" id="refreshProducts" type="button" data-i18n="refreshProducts">刷新商品 ↻</button>
      </div>
      <p class="form-message" id="shopMessage" role="status" aria-live="polite"></p>
      <div class="catalog-tools">
        <label class="search-box"><span aria-hidden="true">⌕</span><input id="productSearch" type="search" placeholder="搜索商品名称…" data-i18n-placeholder="searchPlaceholder" autocomplete="off"></label>
        <div class="catalog-selects">
          <label><span class="sr-only" data-i18n="category">商品分类</span><select id="categoryFilter"><option value="" data-i18n="allCategories">全部分类</option></select></label>
          <label><span class="sr-only" data-i18n="sort">商品排序</span><select id="sortProducts"><option value="default" data-i18n="defaultSort">默认排序</option><option value="price-asc" data-i18n="priceLowHigh">价格从低到高</option><option value="price-desc" data-i18n="priceHighLow">价格从高到低</option><option value="stock-desc" data-i18n="stockHighLow">库存从高到低</option></select></label>
        </div>
      </div>
      <div class="product-grid" id="productGrid" aria-live="polite">
        <div class="loading-card" data-i18n="loadingCatalog">正在连接商品目录…</div>
      </div>
    </section>
  </main>
  <div class="modal-backdrop" id="deliveryModal" hidden>
    <section class="delivery-modal" role="dialog" aria-modal="true" aria-labelledby="deliveryTitle">
      <button class="modal-close" id="closeModal" type="button" aria-label="关闭">×</button>
      <div class="eyebrow">订单交付</div>
      <h2 id="deliveryTitle">购买成功</h2>
      <p class="modal-copy">请及时保存以下交付内容。</p>
      <pre class="delivery-content" id="deliveryContent"></pre>
      <button class="primary-button full-button" id="copyDelivery" type="button">复制卡密</button>
    </section>
  </div>
  <footer class="footer-note" style="width:100%;margin:20px auto 0;text-align:center;color:#a1aab8;font-size:10px;line-height:1.6">2026 晴天号铺 版权所有<br>所有账号仅供合法合规用途，严禁用于任何违法行为。</footer>
  <style>
    .account-menu-wrap{position:relative}
    .account-menu-wrap>summary{list-style:none}
    .account-menu-wrap>summary::-webkit-details-marker{display:none}
    .account-menu-wrap[open] .avatar-button{border-color:#93c5fd;box-shadow:0 8px 22px rgba(37,99,235,.15)}
    .avatar-image{width:33px;height:33px;object-fit:cover;border-radius:50%}
    .avatar-large-image{width:52px;height:52px;flex:0 0 52px;object-fit:cover;border-radius:50%}
    .language-toggle{width:100%;border:0;background:#fff;cursor:pointer;font-family:inherit}
    .language-toggle strong{color:#3984d8;font-size:13px}
  </style>
  <script>
  (() => {
    const wrap = document.getElementById("accountMenuWrap");
    const toggle = document.getElementById("accountMenuToggle");
    const menu = document.getElementById("accountMenu");
    if (!wrap || !toggle || !menu) return;
    // Native <details>/<summary> owns the open state; no competing click toggles.
    toggle.dataset.menuBound = "true";
    const syncMenu = () => {
      menu.hidden = !wrap.open;
      toggle.setAttribute("aria-expanded", String(wrap.open));
    };
    wrap.addEventListener("toggle", syncMenu);
    document.addEventListener("click", event => {
      if (wrap.open && !wrap.contains(event.target)) wrap.open = false;
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && wrap.open) {
        wrap.open = false;
        toggle.focus();
      }
    });
    syncMenu();
  })();
  </script>
  <script src="./script.js?v=storefront-home-nav-20261118-v1" defer></script>


</body>
</html>
