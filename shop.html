  <script>
  (() => {
    const wrap = document.getElementById("accountMenuWrap");
    const toggle = document.getElementById("accountMenuToggle");
    const menu = document.getElementById("accountMenu");
    if (!wrap || !toggle || !menu) return;
    // Native <details>/<summary> owns the open state; no competing click toggles.
    toggle.dataset.menuBound = "true";
    const syncMenu = () => {
      menu.hidden = !wrap.open;
      toggle.setAttribute("aria-expanded", String(wrap.open));
    };
    wrap.addEventListener("toggle", syncMenu);
    document.addEventListener("click", event => {
      if (wrap.open && !wrap.contains(event.target)) wrap.open = false;
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && wrap.open) {
        wrap.open = false;
        toggle.focus();
      }
    });
    syncMenu();
  })();
  </script>

<script>
(() => {
 const view=new URLSearchParams(location.search).get("view");

 const API="https://qingtian-shop-api.chulingli1988.workers.dev",KEY="qingtian_shop_token";
 const token=localStorage.getItem(KEY);
 if(!token){location.replace("/auth.html");return;}
 document.title=(view==="profile"?"账户信息":"邀请奖励")+" · 晴天号铺";
 document.body.innerHTML=`

ation:none}.sub-crumb span[aria-current="page"]{color:#344256;font-weight:650}
 </style>
 <header class="sub-top"><a class="sub-brand" href="/shop.html"><img src="/logo.jpg" alt="">晴天号铺</a><a class="sub-back" href="/shop.html">返回商城首页</a></header>
 <main class="sub-wrap"><nav class="sub-crumb" aria-label="当前位置"><a href="/shop.html">首页</a><span> / </span><a href="/shop.html#accountMenuWrap">我的账户</a><span> / </span><span aria-current="page">${view==="profile"?"账户信息":"邀请奖励"}</span></nav><div id="subContent" class="sub-card">正在加载…</div></main>`;
 const el=id=>document.getElementById(id);
 async function api(path,options={}){const r=await fetch(API+path,{...options,headers:{Authorization:"Bearer "+token,"Content-Type":"application/json",...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem(KEY);location.replace("/auth.html");throw Error("登录已过期")}if(!r.ok||d.ok===false)throw Error(d.error||"请求失败");return d}
 if(view==="profile"){
  el("subContent").innerHTML='<h1>账户信息</h1><div class="sub-row"><div class="sub-avatar" id="subAvatar">晴</div><div><b id="subName">正在加载…</b><div class="sub-muted" id="subEmail"></div></div></div><div class="sub-balance"><span>账户余额</span><strong id="subBalance">¥0.00</strong></div><div class="sub-field"><label for="subNickname">商城昵称</label><input id="subNickname" maxlength="24" placeholder="请输入昵称"></div><div class="sub-field"><label for="subFile">上传头像</label><input id="subFile" type="file" accept="image/jpeg,image/png,image/webp"><p class="sub-muted">支持 JPG、PNG、WebP 图片。</p></div><button class="sub-btn" id="subSave">保存资料</button><p class="sub-msg" id="subMsg"></p>';
  let avatar="";
  function renderAvatar(src,name){el("subAvatar").innerHTML=src?'<img alt="头像" src="'+src+'">':(name||"晴").trim().charAt(0).toUpperCase()}
  try{const d=await api("/api/user/info"),u=d.user||{};el("subNickname").value=u.nickname||"";el("subName").textContent=u.nickname||"我的账户";el("subEmail").textContent=u.email||"";el("subBalance").textContent="¥"+(u.balance_cny||"0.00");avatar=u.avatar_url||"";renderAvatar(avatar,u.nickname||u.email)}catch(e){el("subMsg").textContent=e.message}
  el("subFile").onchange=e=>{const file=e.target.files?.[0];if(!file)return;if(!/^image\/(jpeg|png|webp)$/.test(file.type)){el("subMsg").textContent="请选择 JPG、PNG 或 WebP 图片";return}const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const c=document.createElement("canvas"),scale=Math.min(1,320/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext("2d").drawImage(img,0,0,c.width,c.height);avatar=c.toDataURL("image/jpeg",.78);renderAvatar(avatar,el("subNickname").value);URL.revokeObjectURL(url);el("subMsg").textContent="头像已选中，请保存资料"};img.src=url};
  el("subSave").onclick=async()=>{const nickname=el("subNickname").value.trim();if(!nickname){el("subMsg").textContent="昵称不能为空";return}el("subSave").disabled=true;try{await api("/api/user/profile",{method:"POST",body:JSON.stringify({nickname,avatar_data_url:avatar})});el("subName").textContent=nickname;renderAvatar(avatar,nickname);el("subMsg").textContent="保存成功"}catch(e){el("subMsg").textContent="保存失败："+e.message}finally{el("subSave").disabled=false}};
 }else{
  el("subContent").innerHTML='<h1>邀请奖励</h1><div class="sub-stat"><span>成功邀请人数</span><strong id="subCount">—</strong></div><div class="sub-stat"><span>累计奖励</span><strong id="subReward">¥0.00</strong></div><p class="sub-muted">邀请好友注册，符合活动规则后奖励自动计入账户。</p><hr style="border:0;border-top:1px solid #edf0f4;margin:22px 0"><h3>我的专属邀请码</h3><div class="sub-code" id="subCode">加载中…</div><input class="sub-url" id="subUrl" readonly><button class="sub-btn" id="subCopy">复制邀请链接</button><p class="sub-msg" id="subMsg"></p><hr style="border:0;border-top:1px solid #edf0f4;margin:22px 0"><h3>奖励记录</h3><div id="subRecords" class="sub-muted">正在加载…</div>';
  try{const d=await api("/api/user/referrals");el("subCount").textContent=d.invited_count??0;el("subReward").textContent="¥"+(d.reward_cny||"0.00");el("subCode").textContent=d.referral_code||"—";el("subUrl").value=d.referral_url||"";const rows=d.rewards||[];el("subRecords").innerHTML=rows.length?rows.map(x=>'<div class="sub-record">'+(x.email||"好友")+'　<strong style="color:#19834f">+¥'+x.amount_cny+'</strong></div>').join(""):"暂无奖励记录"}catch(e){el("subRecords").textContent="加载失败："+e.message}
  el("subCopy").onclick=async()=>{try{await navigator.clipboard.writeText(el("subUrl").value);el("subMsg").textContent="邀请链接已复制"}catch{el("subUrl").select();document.execCommand("copy");el("subMsg").textContent="邀请链接已复制"}};
 }
})();
</script>
