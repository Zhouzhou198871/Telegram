<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 晴天号铺</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="header">
        <img src="./logo.jpg" alt="Logo">
        <div class="header-text">
            <span class="zh">晴天号铺</span>
        </div>
    </div>

    <div class="auth-panel">
        <div class="title-zh">欢迎回来</div>
        <div class="subtitle">请登录你的晴天号铺账户。</div>

        <form>
            <div class="form-group">
                <label>账号 / 邮箱</label>
                <input type="text" placeholder="请输入账号或邮箱" required>
            </div>

            <div class="form-group">
                <label>密码</label>
                <input type="password" placeholder="请输入密码" required>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox"> 记住密码
                </label>
                <a href="#" class="forgot-pwd">忘记密码？</a>
            </div>

            <button type="submit" class="btn-primary">登 录</button>
        </form>

        <div class="go-register">没有账号？ <a href="./register.html">立即注册</a></div>
    </div>

    <div class="footer-note">晴天号铺 · 安全访问</div>
</body>
</html>
