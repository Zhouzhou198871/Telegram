<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 晴天号铺</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="header">
        <img src="./logo.jpg" alt="Logo">
        <div class="header-text">
            <span class="zh">晴天号铺</span>
            <span class="en">QINGTIAN STORE</span>
        </div>
    </div>

    <div class="auth-panel">
        <div class="title-en">SECURE EMAIL ACCESS</div>
        <div class="title-zh">欢迎回来</div>
        <div class="subtitle">使用邮箱验证码，安全进入你的晴天号铺账户。</div>

        <form>
            <div class="form-group">
                <label>邮箱地址</label>
                <input type="email" placeholder="name@example.com" required>
            </div>

            <div class="code-row">
                <div class="form-group">
                    <label>邮箱验证码</label>
                    <input type="text" placeholder="输入 6 位验证码" required>
                </div>
                <button type="button" class="btn-code">获取验证码</button>
            </div>

            <div class="agreement-box">
                <label class="agree-item">
                    <input type="checkbox"> 我已阅读并同意 <a href="#">用户协议</a>
                </label>
                <label class="agree-item">
                    <input type="checkbox"> 我已阅读并同意 <a href="#">隐私政策</a>
                </label>
            </div>

            <button type="submit" class="btn-primary">安全登录 →</button>
        </form>

        <div class="go-register">没有账号？ <a href="./register.html">去注册</a></div>
    </div>

    <div class="footer-note">QINGTIAN STORE · SECURE ACCESS</div>
</body>
</html>
