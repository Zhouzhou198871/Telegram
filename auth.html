<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F9F9F6"><meta name="description" content="晴天号铺 · 安全邮箱登录">
<title>安全登录 · 晴天号铺</title><link rel="stylesheet" href="./style.css">
</head>
<body data-page="auth">
<canvas id="particleCanvas" class="particle-canvas" aria-hidden="true"></canvas><div class="auth-vignette" aria-hidden="true"></div>
<div class="astronaut-stage" id="astronautStage" aria-label="3D 宇航员展示区"></div>
<header class="topbar auth-topbar">
<a class="brand auth-brand" href="./index.html" aria-label="晴天号铺 QINGTIAN STORE">
<span class="brand-image-wrap"><img class="brand-logo" src="./logo.jpg" alt="晴天号铺 Logo"></span>
<span class="brand-copy"><strong>晴天号铺</strong><small>QINGTIAN STORE</small></span></a>
<div class="auth-header-actions"><button class="language-toggle" id="languageToggle" type="button" aria-label="Switch language"><span data-lang-label="zh">中</span><i>/</i><span data-lang-label="en">EN</span></button><a class="nav-cta" href="https://t.me/qingtian_Boss" target="_blank" rel="noopener noreferrer" data-i18n="support">联系客服 ↗</a></div>
</header>
<main class="auth-shell"><section class="auth-panel" aria-labelledby="authTitle">
<div class="auth-eyebrow"><span class="auth-live-dot"></span><span data-i18n="eyebrow">SECURE EMAIL ACCESS</span></div>
<h1 id="authTitle" data-i18n="title">欢迎回来</h1><p class="auth-subtitle" data-i18n="subtitle">使用邮箱验证码，安全进入你的晴天号铺账户。</p>
<form id="authForm" novalidate>
<div class="auth-field"><label class="field-label" for="email" data-i18n="emailLabel">邮箱地址</label><input class="text-input" id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required maxlength="254" aria-describedby="emailError"><p class="field-error" id="emailError" aria-live="polite"></p></div>
<div class="code-row"><div class="auth-field code-field"><label class="field-label" for="code" data-i18n="codeLabel">邮箱验证码</label><input class="text-input" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="输入 6 位验证码" maxlength="6" pattern="[0-9]{6}" required aria-describedby="codeError"><p class="field-error" id="codeError" aria-live="polite"></p></div><button class="secondary-button code-button" id="sendCode" type="button" data-i18n="sendCode">获取验证码</button></div>
<div class="auth-legal"><label class="legal-check"><input id="agreeTerms" type="checkbox"><span data-i18n="agreePrefix">我已阅读并同意</span> <a href="./terms.html" target="_blank" rel="noopener" data-i18n="terms">用户协议</a></label><label class="legal-check"><input id="agreePrivacy" type="checkbox"><span data-i18n="agreePrefix">我已阅读并同意</span> <a href="./privacy.html" target="_blank" rel="noopener" data-i18n="privacy">隐私政策</a></label><p class="field-error legal-error" id="legalError" aria-live="polite"></p></div>
<button class="primary-button full-button login-button" id="loginButton" type="submit"><span class="button-spinner" aria-hidden="true"></span><span class="login-button-text" data-i18n="login">安全登录</span><span class="login-arrow" aria-hidden="true">→</span></button>
<p class="form-message" id="authMessage" role="status" aria-live="polite"></p></form>
<div class="auth-security-note"><span aria-hidden="true">⌑</span><span data-i18n="securityNote">验证码 5 分钟内有效，请勿向任何人透露。</span></div>
<p class="auth-switch">没有账号？<a href="./register.html">去注册</a></p>
</section><footer class="auth-foot">QINGTIAN STORE <span>·</span> SECURE ACCESS</footer></main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module" src="./astronaut-3d.js"></script><script src="./script.js" defer></script></body></html>
