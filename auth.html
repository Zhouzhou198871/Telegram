<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070b12">
  <meta name="description" content="晴天商城邮箱登录">
  <title>邮箱登录 · 晴天商城</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body data-page="auth">
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <header class="topbar">
    <a class="brand" href="./index.html"><span class="brand-mark">Q</span><span class="brand-name">QINGTIAN<span> / STORE</span></span></a>
    <a class="nav-cta" href="https://t.me/qingtian_Boss" target="_blank" rel="noopener noreferrer">联系客服 ↗</a>
  </header>
  <main class="auth-shell">
    <section class="auth-panel">
      <div class="eyebrow"><span class="pulse"></span> SECURE EMAIL ACCESS</div>
      <h1>欢迎回来<span>。</span></h1>
      <p class="hero-copy">使用邮箱验证码安全登录晴天商城。</p>
      <form id="authForm" novalidate>
        <label class="field-label" for="email">邮箱地址</label>
        <input class="text-input" id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required maxlength="254">
        <div class="code-row">
          <div class="code-field">
            <label class="field-label" for="code">邮箱验证码</label>
            <input class="text-input" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="输入 6 位验证码" maxlength="6" pattern="[0-9]{6}" required>
          </div>
          <button class="secondary-button code-button" id="sendCode" type="button">获取验证码</button>
        </div>
        <button class="primary-button full-button" id="loginButton" type="submit">安全登录 <span>→</span></button>
        <p class="form-message" id="authMessage" role="status" aria-live="polite"></p>
      </form>
      <p class="legal-note">验证码 5 分钟内有效。请勿向任何人透露验证码。</p>
    </section>
    <div class="auth-foot">QINGTIAN DIGITAL STORE · SECURE ACCESS</div>
  </main>
  <script src="./script.js" defer></script>
</body>
</html>
