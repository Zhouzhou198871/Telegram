.invite-header{width:min(900px,calc(100% - 32px));height:76px;margin:auto;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5eaf1}

.invite-actions{display:flex;gap:9px}.invite-actions a,.invite-actions button,.invite-home-link{border:1px solid #dce3ec;border-radius:10px;background:#fff;color:#3b82f6;padding:9px 12px;text-decoration:none;font-size:13px;cursor:pointer}
.invite-actions a,.invite-actions button{border:1px solid #dce3ec;border-radius:10px;background:#fff;color:#3b82f6;padding:9px 12px;text-decoration:none;font-size:13px;cursor:pointer}
.invite-main{width:min(760px,calc(100% - 32px));margin:24px auto 60px}.invite-breadcrumb{font-size:13px;color:#8491a3;margin-bottom:22px}.invite-breadcrumb a{color:#3984d8;text-decoration:none}
.invite-main h1{font-size:27px;margin:0 0 8px;color:#243247}.invite-subtitle{font-size:14px;color:#748196;line-height:1.7;margin:0 0 22px}
.invite-hero{padding:23px;border:1px solid #dce7f6;border-radius:16px;background:linear-gradient(130deg,#eff5ff,#e1ebfb);margin-bottom:16px}
.invite-hero h2{font-size:20px;color:#334155;margin:0 0 9px}.invite-hero p{font-size:13px;line-height:1.8;color:#64748b;margin:0}
.invite-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.invite-stat{padding:18px;border:1px solid #e0e5ec;border-radius:13px;background:#fff}.invite-stat span{display:block;font-size:13px;color:#7b8797}.invite-stat strong{display:block;margin-top:9px;font-size:24px;color:#16834a}
.invite-link-card,.invite-rules,.invite-history{padding:19px;border:1px solid #e0e5ec;border-radius:14px;background:#fff;margin-top:14px}

.invite-link-row{display:flex;gap:8px}.invite-link-row input{min-width:0;flex:1;height:44px;border:1px solid #d7e0eb;border-radius:9px;padding:0 11px;background:#f8fafc;color:#526174;font-size:12px}
.invite-link-row button{border:0;border-radius:9px;background:#397ee8;color:#fff;padding:0 15px;font-weight:700}
.invite-rules p{font-size:13px;line-height:1.9;color:#64748b;margin:6px 0}
.invite-history-list{display:flex;flex-direction:column;gap:0}.invite-reward-row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid #edf1f6;font-size:13px;color:#64748b}.invite-reward-row strong{color:#16834a;white-space:nowrap}
.invite-empty,.invite-message{font-size:13px;color:#94a0b1;line-height:1.7;padding:12px 0}.invite-message.error{color:#dc2626}
