<style>
body[data-page="workbench"]{background:#f7f9fc;color:#243247;min-height:100vh}
.wb-header{width:min(1120px,calc(100% - 32px));height:76px;margin:auto;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5eaf1}
.wb-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#243247;font-size:19px;font-weight:800}.wb-brand img{width:42px;height:42px;border-radius:12px;object-fit:cover}
.wb-home{border:1px solid #dce3ec;border-radius:10px;background:#fff;color:#3b82f6;padding:10px 14px;text-decoration:none;font-size:14px}
.wb-main{width:min(920px,calc(100% - 32px));margin:28px auto 60px}
.wb-breadcrumb{font-size:13px;color:#8491a3;margin-bottom:22px}.wb-breadcrumb a{color:#3984d8;text-decoration:none}
.wb-title{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:22px}.wb-title h1{font-size:28px;margin:0 0 7px}.wb-title p{margin:0;color:#748196;font-size:14px}
.wb-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.wb-card{padding:20px;border:1px solid #e0e5ec;border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(15,23,42,.04)}
.wb-card span{display:block;color:#7b8797;font-size:13px}.wb-card strong{display:block;margin-top:10px;font-size:25px;color:#243247;font-variant-numeric:tabular-nums}
.wb-section{margin-top:18px;padding:20px;border:1px solid #e0e5ec;border-radius:16px;background:#fff}
.wb-section h2{font-size:17px;margin:0 0 14px}.wb-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wb-link{display:block;padding:15px;border:1px solid #e3eaf3;border-radius:12px;background:#f9fbff;color:#315f9b;text-decoration:none;font-weight:700}
.wb-link small{display:block;margin-top:5px;color:#8491a3;font-weight:400;font-size:12px}
.wb-order{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid #edf1f6;font-size:13px}.wb-order div{min-width:0}.wb-order strong{display:block;overflow-wrap:anywhere;color:#334155}.wb-order small{color:#8491a3}.wb-order b{white-space:nowrap;color:#16834a}
.wb-state{padding:20px;text-align:center;color:#8491a3}
@media(max-width:620px){.wb-grid{grid-template-columns:1fr 1fr}.wb-links{grid-template-columns:1fr 1fr}.wb-main{margin-top:20px}.wb-title h1{font-size:24px}}
