<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc"><meta name="description" content="晴天号铺账户密码重置">
<title>重置密码 · 晴天号铺</title><link rel="icon" type="image/jpeg" href="./logo.jpg">
<style>
:root{color-scheme:light;--blue:#3b82f6;--ink:#172033;--line:#dbe2ea}
*{box-sizing:border-box}html{min-height:100%;background:#f8fafc}
body{margin:0;min-height:100vh;min-height:100svh;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#f8fafc,#eff6ff 55%,#f8fafc);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.shell{width:100%;max-width:440px;margin:auto}.panel{padding:32px;border:1px solid rgba(226,232,240,.9);border-radius:24px;background:#fff;box-shadow:0 18px 50px rgba(15,23,42,.08)}
.header{text-align:center;margin-bottom:25px}.logo{width:62px;height:62px;object-fit:cover;border-radius:18px;margin-bottom:14px}.eyebrow{margin:0 0 8px;color:#2563eb;font-size:11px;font-weight:800;letter-spacing:.12em}.header h1{margin:0;font-size:25px;letter-spacing:-.03em}.sub{margin:9px 0 0;color:#8490a2;font-size:13px;line-height:1.7}
.steps{display:flex;align-items:center;gap:9px;margin:0 0 25px}.step{display:flex;align-items:center;gap:7px;color:#94a3b8;font-size:11px;white-space:nowrap}.num{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:#eef2f7;color:#64748b;font-size:11px;font-weight:800}.step.active{color:#2563eb;font-weight:700}.step.active .num,.step.done .num{background:#dbeafe;color:#2563eb}.line{height:1px;flex:1;background:#e5eaf1}
.form{display:grid;gap:17px}.group label{display:block;margin-bottom:8px;color:#334155;font-size:13px;font-weight:700}.input{width:100%;height:50px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#172033;font-size:14px;outline:none}.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.12)}.input:disabled{background:#f8fafc;color:#64748b}
.code-row{display:flex;gap:9px}.code-row .input{min-width:0;flex:1}.send{flex:0 0 116px;height:50px;border:1px solid #bfdbfe;border-radius:12px;background:#eff6ff;color:#2563eb;font-size:12px;font-weight:800;cursor:pointer}.send:disabled{opacity:.6;cursor:not-allowed}
.primary{width:100%;height:52px;border:0;border-radius:13px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:white;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 7px 16px rgba(37,99,235,.18)}.primary:disabled{opacity:.65;cursor:wait}
.hint{margin:-8px 0 0;color:#94a3b8;font-size:11px;line-height:1.6}.message{margin:0;text-align:center;font-size:12px;line-height:1.6;color:#dc2626}.message.success{color:#15803d}.message:empty{display:none}
.back{display:block;margin-top:20px;text-align:center;color:#64748b;font-size:12px;text-decoration:none}.back:hover{color:#2563eb}
.footer-note{margin:17px 0 0;text-align:center;color:#a1aab8;font-size:10px;line-height:1.6}
.security{margin:18px 0 0;padding:12px;border-radius:11px;background:#f8fafc;color:#8490a2;font-size:11px;line-height:1.7}.security strong{color:#64748b}
[hidden]{display:none!important}
@media(max-width:420px){body{padding:16px 13px}.panel{padding:27px 21px;border-radius:21px}.header h1{font-size:23px}.send{flex-basis:108px;font-size:11px}}
</style>
</head>
<body>
<main class="shell"><section class="panel">
<header class="header"><img class="logo" src="./logo.jpg" alt="晴天号铺"><p class="eyebrow">ACCOUNT SECURITY</p><h1>重置登录密码</h1><p class="sub">通过注册邮箱验证身份，安全地设置新密码。</p></header>
<div class="steps" aria-label="重置步骤"><div class="step active" id="stepOne"><span class="num">1</span>验证邮箱</div><span class="line"></span><div class="step" id="stepTwo"><span class="num">2</span>设置新密码</div></div>
<form class="form" id="resetForm" novalidate>
<div class="group"><label for="email">注册邮箱</label><input class="input" id="email" type="email" autocomplete="email" maxlength="254" placeholder="请输入注册时使用的邮箱" required></div>
<div class="group"><label for="code">邮箱验证码</label><div class="code-row"><input class="input" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位验证码" required><button class="send" id="sendCode" type="button">获取验证码</button></div></div>
<div class="group" id="passwordGroup" hidden><label for="password">设置新密码</label><input class="input" id="password" type="password" autocomplete="new-password" minlength="8" maxlength="20" placeholder="8–20 位，必须包含字母和数字"><p class="hint">请勿使用其他网站的旧密码。建议使用独立且不易猜测的密码。</p></div>
<div class="group" id="confirmGroup" hidden><label for="confirmPassword">确认新密码</label><input class="input" id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="20" placeholder="再次输入新密码"></div>
<p class="message" id="message" role="status" aria-live="polite"></p>
<button class="primary" id="submitButton" type="submit">验证并继续</button>
</form>
<div class="security"><strong>安全提示</strong><br>验证码 5 分钟内有效，连续输错 5 次将失效。重置成功后，其他已登录设备会退出登录。</div>
<a class="back" href="./auth.html">← 返回登录</a>
<p class="footer-note">2026 晴天号铺 (lynli.me) 版权所有<br>所有账号仅供合法合规用途，严禁用于任何违法行为。</p>
</section></main>
<script src="./script.js" defer></script><script src="./reset-password.js?v=1" defer></script>
</body></html>
