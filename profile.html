<body data-page="profile">
<header class="profile-header">
<a class="profile-brand" href="./shop.html"><img src="./logo.jpg" alt="晴天号铺"><span>晴天号铺</span></a>
<nav class="account-subnav" aria-label="账户导航"><a href="./shop.html">返回首页</a><a href="./orders.html">订单详情</a><a href="./profile.html" aria-current="page">个人中心</a><a href="./invite.html">邀请奖励</a><a href="./workbench.html">工作台</a><a href="./recharge.html">充值入口</a><a href="./withdraw.html">余额提现</a></nav></header>
<main class="profile-main">
<nav class="profile-breadcrumb" aria-label="当前位置"><strong>当前位置：</strong><a href="./shop.html">首页</a><span aria-hidden="true"> / </span><span aria-current="page">账户信息</span></nav>
<h1>账户信息</h1><p class="profile-subtitle">管理账户资料、安全设置与账户服务。</p>
<section class="profile-panel">
  <div class="profile-avatar-row">
    <div class="profile-avatar"><span id="avatarFallback">晴</span><img id="avatarPreview" alt="账户头像" hidden></div>
    <div class="profile-avatar-actions"><input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp" hidden><button id="chooseAvatar" type="button">上传头像</button><span class="profile-hint">支持 JPG、PNG、WebP，自动压缩</span></div>
  </div>
  <div class="profile-field"><label for="nickname">昵称</label><input id="nickname" maxlength="24" placeholder="请输入昵称"></div>
  <div class="profile-field"><label for="email">登录邮箱</label><input id="email" readonly></div>
  <div class="profile-balance"><span>账户余额</span><strong id="balance">¥0.00</strong></div>
  <button class="profile-save" id="saveProfile" type="button">保存资料</button>
  <div class="account-password">
    <h2>修改登录密码</h2>
    <p class="profile-section-desc">密码需为 8–20 位，并同时包含字母和数字。修改成功后需要重新登录。</p>
    <div class="profile-field"><label for="currentPassword">当前密码</label><input id="currentPassword" type="password" autocomplete="current-password"></div>
    <div class="profile-field"><label for="newPassword">新密码</label><input id="newPassword" type="password" autocomplete="new-password"></div>
    <div class="profile-field"><label for="confirmPassword">确认新密码</label><input id="confirmPassword" type="password" autocomplete="new-password"></div>
    <button class="profile-save secondary-save" id="changePassword" type="button">修改密码</button>
    <p class="profile-message" id="passwordMessage" role="status" aria-live="polite"></p>
  </div>
  <p class="profile-message" id="profileMessage" role="status" aria-live="polite"></p>
</section>
</main>
<footer class="footer-note" style="width:100%;margin:0 auto 18px;text-align:center;color:#a1aab8;font-size:10px;line-height:1.7">2026 晴天号铺 版权所有<br>所有账号仅供合法合规用途，严禁用于任何违法行为。</footer>
