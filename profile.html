<body data-page="profile">
<header class="profile-header">
<a class="profile-brand" href="./shop.html"><img src="./logo.jpg" alt="晴天号铺"><span>晴天号铺</span></a>
<div class="profile-actions"><button id="languageToggle" type="button">English</button><a href="./shop.html" data-i18n="backShop">返回商城</a></div>
</header>
<main class="profile-main">
<nav class="profile-breadcrumb" aria-label="当前位置"><strong data-i18n="currentLocation">当前位置：</strong><a href="./shop.html" data-i18n="home">首页</a><span aria-hidden="true"> / </span><span aria-current="page" data-i18n="accountInfo">账户信息</span></nav>
<h1 data-i18n="title">账户信息</h1><p class="profile-subtitle" data-i18n="subtitle">管理你的头像、昵称和账户资料。</p>
<section class="profile-panel">
<div class="profile-avatar-row">
<div class="profile-avatar"><span id="avatarFallback">晴</span><img id="avatarPreview" alt="账户头像" hidden></div>
<div class="profile-avatar-actions"><input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp" hidden><button id="chooseAvatar" type="button" data-i18n="chooseAvatar">上传头像</button><span class="profile-hint" data-i18n="avatarHint">支持 JPG、PNG、WebP，自动压缩</span></div>
</div>
<div class="profile-field"><label for="nickname" data-i18n="nickname">昵称</label><input id="nickname" maxlength="24" placeholder="请输入昵称" data-i18n-placeholder="nicknamePlaceholder"></div>
<div class="profile-field"><label for="email" data-i18n="email">登录邮箱</label><input id="email" readonly></div>
<div class="profile-balance"><span data-i18n="balance">账户余额</span><strong id="balance">¥0.00</strong></div>
<section class="profile-recharge" aria-labelledby="rechargeTitle">
<h2 id="rechargeTitle" data-i18n="rechargeTitle">余额充值</h2>
<p class="profile-recharge-desc" data-i18n="rechargeDesc">选择充值金额，提交后联系客服获取当前收款方式。</p>
<div class="recharge-presets" role="group" aria-label="充值金额">
<button class="recharge-preset" type="button" data-recharge-amount="80" aria-pressed="true">¥80</button>
<button class="recharge-preset" type="button" data-recharge-amount="160" aria-pressed="false">¥160</button>
<button class="recharge-preset" type="button" data-recharge-amount="300" aria-pressed="false">¥300</button>
<button class="recharge-preset" type="button" data-recharge-amount="500" aria-pressed="false">¥500</button>
</div>
<label class="profile-field" for="rechargeAmount"><span data-i18n="customAmount">自定义金额（人民币）</span>
<span class="recharge-input-wrap"><span>¥</span><input id="rechargeAmount" type="number" inputmode="decimal" min="80" max="50000" step="0.01" value="80" placeholder="最低 ¥80"></span></label>
<p class="recharge-hint" id="rechargeHint" data-i18n="rechargeHint">最低充值 ¥80（约 10 USDT）。目前通过 USDT（TRC20）人工确认收款；请先联系客服获取实时收款地址。</p>
<a class="recharge-contact" id="rechargeContact" href="https://t.me/qingtian_Boss" target="_blank" rel="noopener noreferrer" data-i18n="rechargeContact">确认金额并联系客服</a>
</section>
<button class="profile-save" id="saveProfile" type="button" data-i18n="save">保存资料</button>
<p class="profile-message" id="profileMessage" role="status" aria-live="polite"></p>
</section>
<section class="profile-history" aria-labelledby="rechargeHistoryTitle">
<h2 id="rechargeHistoryTitle" data-i18n="rechargeHistoryTitle">充值详细记录</h2>

<table class="recharge-table">
<thead><tr><th data-i18n="historyTime">时间</th><th data-i18n="historyOrder">订单号</th><th data-i18n="historyAmount">充值金额</th><th data-i18n="historyMethod">充值方式</th><th data-i18n="historyStatus">状态</th></tr></thead>
</table>
</div>
<div class="recharge-empty" id="rechargeHistoryEmpty" role="status" data-i18n="historyNotSynced">充值明细暂未同步到网页账户，暂不展示未经核实的记录。</div>
</section>
</main>
